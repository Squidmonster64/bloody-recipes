name: Recipes runtime smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public Recipes URL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 \
            -o /tmp/recipes.html https://recipes.bloodydaves.com/
          grep -Eiq "Bloody Dave|Recipes|Recipe" /tmp/recipes.html
          echo "PUBLIC_RECIPES_OK"

      - name: Inspect Railway domain status if repository token exists
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${RAILWAY_API_TOKEN:-}" ]; then
            echo "RAILWAY_CI_TOKEN_PRESENT=api"
          elif [ -n "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_CI_TOKEN_PRESENT=project"
          else
            echo "RAILWAY_CI_TOKEN_PRESENT=no"
            exit 0
          fi
          npx -y @railway/cli@latest domain status studio.recipes.bloodydaves.com \
            --project cd49c876-a4fc-4353-b012-0a039dfd4a2d \
            --environment production --service recipe-studio --json || true

      - name: Diagnose Recipe Studio TLS and route
        shell: bash
        run: |
          set -euo pipefail
          echo "CNAME:"
          dig +short CNAME studio.recipes.bloodydaves.com || true
          echo "TXT hostname:"
          dig +short TXT studio.recipes.bloodydaves.com || true
          echo "A/AAAA:"
          dig +short A studio.recipes.bloodydaves.com || true
          dig +short AAAA studio.recipes.bloodydaves.com || true
          echo "CAA apex:"
          dig +short CAA bloodydaves.com || true
          echo "CERTIFICATE:"
          timeout 20 openssl s_client -connect studio.recipes.bloodydaves.com:443 -servername studio.recipes.bloodydaves.com </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -issuer -ext subjectAltName || true
          strict_code=$(curl --silent --show-error --location --max-time 30 \
            --output /tmp/studio-strict.html --write-out '%{http_code}' \
            https://studio.recipes.bloodydaves.com/ || true)
          echo "strict_http=${strict_code:-curl-failed}"
          insecure_code=$(curl --insecure --silent --show-error --location --max-time 30 \
            --output /tmp/studio.html --write-out '%{http_code}' \
            https://studio.recipes.bloodydaves.com/ || true)
          echo "insecure_http=${insecure_code:-curl-failed}"
          if [ "$strict_code" != "200" ] && [ "$strict_code" != "302" ] && [ "$strict_code" != "401" ] && [ "$strict_code" != "403" ]; then
            echo "RECIPE_STUDIO_TLS_OR_ROUTE_BROKEN"
            exit 1
          fi
          echo "RECIPE_STUDIO_ROUTE_OK"
