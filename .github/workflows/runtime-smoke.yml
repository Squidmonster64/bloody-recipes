name: Recipes runtime smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public Recipes URL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 -o /tmp/recipes.html https://recipes.bloodydaves.com/
          grep -Eiq "Bloody Dave|Recipes|Recipe" /tmp/recipes.html
          echo "PUBLIC_RECIPES_OK"

      - name: Diagnose Recipe Studio ownership, TLS and route
        shell: bash
        run: |
          set -euo pipefail
          echo "CNAME:"
          dig +short CNAME studio.recipes.bloodydaves.com || true
          echo "RAILWAY_VERIFY_TXT:"
          dig +short TXT _railway-verify.studio.recipes.bloodydaves.com || true
          echo "CAA_APEX:"
          dig +short CAA bloodydaves.com || true
          echo "CERTIFICATE:"
          timeout 20 openssl s_client -connect studio.recipes.bloodydaves.com:443 -servername studio.recipes.bloodydaves.com </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -ext subjectAltName || true
          strict_code=$(curl --silent --show-error --location --max-time 30 --output /tmp/studio-strict.html --write-out '%{http_code}' https://studio.recipes.bloodydaves.com/ || true)
          echo "strict_http=${strict_code:-curl-failed}"
          insecure_code=$(curl --insecure --silent --show-error --location --max-time 30 --output /tmp/studio.html --write-out '%{http_code}' https://studio.recipes.bloodydaves.com/ || true)
          echo "insecure_http=${insecure_code:-curl-failed}"
          if [ "$strict_code" != "200" ] && [ "$strict_code" != "302" ] && [ "$strict_code" != "401" ] && [ "$strict_code" != "403" ]; then
            echo "RECIPE_STUDIO_TLS_OR_ROUTE_BROKEN"
            exit 1
          fi
          echo "RECIPE_STUDIO_ROUTE_OK"
