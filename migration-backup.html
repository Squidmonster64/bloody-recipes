<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloody Dave — device backup</title><style>body{background:#121714;color:#f6f1e6;font:18px/1.5 system-ui;max-width:680px;margin:40px auto;padding:20px}button{font:inherit;padding:12px;background:#d87b36;border:0;border-radius:6px}</style><h1>Back up this device</h1><p>Open this page on recipes.bloodydaves.com using the same browser as your existing recipe app.</p><p>This exports favourites, saved links, shopping selections, Have/Need settings, weekly plans, cooked dates and locally promoted recipes.</p><button id="export">Download device backup</button><p id="status" role="status"></p><script>const keys=["bd:selected:v4", "bd:favourite-overrides:v4", "bd:item-statuses:v4", "bd:have:v2", "bd:promoted-recipes:v4", "bd:week-plan:v1", "bd:cooked-at:v1", "bd:saved-recipes:v1"];document.getElementById('export').onclick=()=>{if(location.hostname!=='recipes.bloodydaves.com'){document.getElementById('status').textContent='Open this page on the original recipes.bloodydaves.com domain. Other origins cannot read your old app data.';return;}const data={format:'bloody-daves-browser-backup',version:1,exportedAt:new Date().toISOString(),origin:location.origin,values:Object.fromEntries(keys.map(k=>[k,localStorage.getItem(k)]))};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='bloody-daves-browser-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);document.getElementById('status').textContent='Downloaded. Restore this file using Backup and migration status in the Floot library.';};</script></html>
